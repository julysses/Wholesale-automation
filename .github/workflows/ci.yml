name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python scripts/run_offline_tests.py python -m pytest -q --ignore=scripts/test_acquisition_workspace.py --ignore=scripts/test_acquisition_workflow.py

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Reject new lint findings (existing debt tracked explicitly)
        run: npm run lint:check
      - name: Frontend regression tests
        run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  pipeline:
    name: Pipeline contracts and isolated SQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: County collector regression tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/collectors -p 'test_*.py'
      - name: Scoped collector credential routing tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/tests -p 'test_keychain_delivery.py'
      - run: npm audit --audit-level=moderate
      - name: Edge runtime typecheck and rejection tests
        working-directory: .
        run: npx --yes deno@2.9.6 test --lock=deno.lock --frozen --node-modules-dir=none --allow-env --allow-read pipeline/tests/edge-deno.ts

      - name: Acquisition legacy Edge transport rejection
        working-directory: .
        run: npx --yes deno@2.9.6 test --no-check --no-remote --allow-read=frontend/supabase/functions/fb-lead-intake --allow-env=ACQUISITION_ENABLED pipeline/tests/acquisition-edge-deno.ts

  postgres-integration:
    name: Real PostgreSQL ingestion, tracing and scoring contention
    runs-on: ubuntu-24.04
    # Run 40935475072 hit 15m while the expanded 217-test suite was still passing.
    # Keep the full suite and a bounded budget with setup/teardown and runner margin.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          npm install --global deno@2.9.6
      - name: Run isolated TLS database acceptance
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_local.py

      - name: Install SMS contention test dependency
        run: npm ci --ignore-scripts --prefix pipeline
      - name: Real PostgreSQL SMS transport contention
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_sms_transport.py

      - name: Exact owner SMS retest authorization
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_sms_transport.py pipeline/integration/retell-owner-retest.mjs

      - name: Verified existing SMS generation recovery
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_sms_transport.py pipeline/integration/retell-generation-recovery.mjs

      - name: Acquisition workspace isolation and concurrent administration
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 scripts/test_acquisition_workspace.py


  acquisition-workflow:
    name: Acquisition API, calculator and PostgreSQL workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies and isolated database runtime
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Run real acquisition workflow with external networking blocked
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python scripts/run_offline_tests.py --acquisition-workflow

  acquisition-full-upgrade:
    name: Full acquisition schema upgrade and application journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check out reviewed Supautils source
        uses: actions/checkout@v4
        with:
          repository: supabase/supautils
          ref: 7a22990746ec17b1a84cf2a097dda411222f8ec7
          path: .ci-supautils
          persist-credentials: false
      - name: Install PostgreSQL 17 build and test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates build-essential
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/acquisition-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17
          python -m pip install -r requirements.txt
      - name: Build pinned policy-management extension locally
        run: |
          test "$(git -C .ci-supautils rev-parse HEAD)" = 7a22990746ec17b1a84cf2a097dda411222f8ec7
          make -C .ci-supautils PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config PG_VERSION=17 all
          test -f .ci-supautils/supautils.so
      - name: Rehearse full catalog upgrade with external networking blocked
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          ACQUISITION_TEST_SUPAUTILS: ${{ github.workspace }}/.ci-supautils/supautils.so
        run: |
          set -o pipefail
          python scripts/run_offline_tests.py --acquisition-populated-upgrade 2>&1 | tee acquisition-full-upgrade.log
      - name: Retain synthetic rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-full-upgrade-${{ github.sha }}
          path: acquisition-full-upgrade.log
          if-no-files-found: ignore
          retention-days: 14
