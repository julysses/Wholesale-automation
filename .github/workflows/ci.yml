name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Reject new lint findings (existing debt tracked explicitly)
        run: npm run lint:check
      - name: Frontend regression tests
        run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  pipeline:
    name: Pipeline contracts and isolated SQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: County collector regression tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/collectors -p 'test_*.py'
      - name: Scoped collector credential routing tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/tests -p 'test_keychain_delivery.py'
      - run: npm audit --audit-level=moderate
      - name: Edge runtime typecheck and rejection tests
        working-directory: .
        run: npx --yes deno@2.9.6 test --lock=deno.lock --frozen --node-modules-dir=none --allow-env --allow-read pipeline/tests/edge-deno.ts

  postgres-integration:
    name: Real PostgreSQL ingestion, tracing and scoring contention
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          npm install --global deno@2.9.6
      - name: Run isolated TLS database acceptance
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_local.py
