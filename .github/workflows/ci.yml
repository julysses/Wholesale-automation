name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          pip install --require-hashes -r requirements.txt
          pip check
      - name: Run tests
        run: python -m pytest -q

  python-dependencies:
    name: Python locked dependencies and known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check hashed locks and shared API versions
        run: python scripts/release/check_python_locks.py
      - name: Install isolated, hash-pinned audit tools
        run: |
          python -m venv /tmp/wholesale-audit
          /tmp/wholesale-audit/bin/python -m pip install --require-hashes -r requirements-security.txt
          /tmp/wholesale-audit/bin/python -m pip check
      - name: Audit root, production API and audit-tool locks
        run: |
          /tmp/wholesale-audit/bin/pip-audit --strict --no-deps --disable-pip -r requirements.txt
          /tmp/wholesale-audit/bin/pip-audit --strict --no-deps --disable-pip -r api/requirements.txt
          /tmp/wholesale-audit/bin/pip-audit --strict --no-deps --disable-pip -r requirements-security.txt

  api-dependencies:
    name: Production API dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install only the hash-pinned API requirements
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --require-hashes -r api/requirements.txt
          python -m pip check
      - name: Verify actual API cold start without provider access
        run: python scripts/run_offline_tests.py python scripts/release/python_api_smoke.py

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Reject new lint findings (existing debt tracked explicitly)
        run: npm run lint:check
      - name: Frontend regression tests
        run: npm test
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  pipeline:
    name: Pipeline contracts and isolated SQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: County collector regression tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/collectors -p 'test_*.py'
      - name: Scoped collector credential routing tests
        working-directory: .
        run: python3 -m unittest discover -s pipeline/tests -p 'test_keychain_delivery.py'
      - run: npm audit --audit-level=moderate
      - name: Edge runtime typecheck and rejection tests
        working-directory: .
        run: npx --yes deno@2.9.6 test --lock=deno.lock --frozen --node-modules-dir=none --allow-env --allow-read pipeline/tests/edge-deno.ts

  postgres-integration:
    name: Real PostgreSQL ingestion, tracing and scoring contention
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          npm install --global deno@2.9.6
      - name: Run isolated TLS database acceptance
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_local.py

      - name: Install SMS contention test dependency
        run: npm ci --ignore-scripts --prefix pipeline
      - name: Real PostgreSQL SMS transport contention
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 pipeline/integration/run_sms_transport.py
